<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Parallel conductors and midpoint</title>
  <desc id="desc">The left wire carries five amperes out of the page, the right wire carries ten amperes into the page, and P is the midpoint.</desc>
  <rect width="720" height="300" fill="white"/>
  <g stroke="#173b57" stroke-width="4" fill="white">
    <circle cx="180" cy="140" r="45"/><circle cx="540" cy="140" r="45"/>
  </g>
  <circle cx="180" cy="140" r="10" fill="#d24b40"/>
  <g stroke="#d24b40" stroke-width="7"><line x1="520" y1="120" x2="560" y2="160"/><line x1="560" y1="120" x2="520" y2="160"/></g>
  <circle cx="360" cy="140" r="8" fill="#173b57"/>
  <line x1="180" y1="220" x2="540" y2="220" stroke="#173b57" stroke-width="2"/>
  <line x1="180" y1="210" x2="180" y2="230" stroke="#173b57" stroke-width="2"/>
  <line x1="540" y1="210" x2="540" y2="230" stroke="#173b57" stroke-width="2"/>
  <g fill="#173b57" font-family="DejaVu Sans, sans-serif" font-size="22" text-anchor="middle">
    <text x="180" y="70">5 A out</text><text x="540" y="70">10 A in</text>
    <text x="360" y="125">P</text><text x="360" y="255">0.2 m</text>
  </g>
</svg>
