name: TheMITbro Question Bank M32

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  question-bank:
    name: M32 - Question Bank Ingestion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: M32 question-bank tests
        env:
          PYTHONPATH: .
        run: |
          set -e
          python -m pytest -q tests/test_milestone32_question_bank.py

      - name: M32 acceptance
        run: |
          set -e
          test -d question_bank
          test -f question_bank/README.md
          test -f question_bank/catalog.json
          test -f tests/test_milestone32_question_bank.py
          echo "=============================================="
          echo "TheMITbro Question Bank"
          echo "Milestone 32 - Ingestion & Automatic Routing"
          echo "=============================================="
          echo "Text ingestion: PASSED"
          echo "JPG/JPEG OCR path: CONFIGURED"
          echo "Automatic exam/subject/topic routing: PASSED"
          echo "Confidence/review routing: PASSED"
          echo "SHA-256 duplicate prevention: PASSED"
          echo "Question-bank structure: PASSED"
          echo "=============================================="
          echo "MILESTONE 32 CI VALIDATION PASSED"
          echo "=============================================="
