name: GATE EE Batch 001 Formatter Qualification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-batch-001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run qualification tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_gate_ee_batch001_qualification.py
      - name: Generate Formatter v2.0 qualification
        env:
          PYTHONPATH: .
        run: |
          set +e
          python -m src.run_gate_ee_batch_qualification
          rc=$?
          set -e
          test "$rc" -eq 1
          python -c 'import json; p=json.load(open("output/gate_ee_batch_001/FORMATTER_V2_QUALIFICATION.json")); assert p["status"] == "REVIEW_REQUIRED"; assert p["release_gate"] == "BLOCKED"; assert p["paper_eligible_count"] == 0'
          echo "Expected REVIEW_REQUIRED state verified; release remains BLOCKED."
      - name: Confirm frozen v2.0 regression
        env:
          PYTHONPATH: .
        run: python -m pytest -q
