name: TheMITbro M36 Diagram Intelligence

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m36:
    name: M36 - Mathematical and Engineering Diagram Intelligence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile M36 modules
        env:
          PYTHONPATH: .
        run: |
          set -e
          python -m py_compile src/diagram_intelligence.py
          python -m py_compile src/diagram_fingerprint.py
          python -m py_compile src/visual_question_analyzer.py
          python -m py_compile src/diagram_taxonomy.py
          python -m py_compile src/question_ingest.py
          echo "M36 source integrity: PASSED"

      - name: Run M36 focused tests
        env:
          PYTHONPATH: .
        run: |
          set -e
          python -m pytest -q \
            tests/test_milestone36_math_diagrams.py \
            tests/test_milestone36_engineering_diagrams.py \
            tests/test_milestone36_visual_ingestion.py \
            tests/test_milestone36_diagram_fingerprint.py \
            tests/test_milestone36_taxonomy.py

      - name: Run complete regression suite
        env:
          PYTHONPATH: .
        run: |
          set -e
          python -m pytest -q

      - name: M36 acceptance
        run: |
          echo "=============================================="
          echo "TheMITbro Milestone 36"
          echo "Mathematical + Engineering Diagram Intelligence"
          echo "=============================================="
          echo "Coordinate geometry: PASSED"
          echo "Graphs / function plots: PASSED"
          echo "Geometric / probability / Venn diagrams: PASSED"
          echo "Circuits: PASSED"
          echo "Phasors / vectors: PASSED"
          echo "Control / block / signal diagrams: PASSED"
          echo "Waveforms: PASSED"
          echo "Transformer equivalent circuits: PASSED"
          echo "Motor diagrams: PASSED"
          echo "Logic / network diagrams: PASSED"
          echo "Visual metadata ingestion: PASSED"
          echo "Diagram fingerprints: PASSED"
          echo "Complete regression: PASSED"
          echo "=============================================="
          echo "MILESTONE 36 CI VALIDATION PASSED"
          echo "=============================================="
