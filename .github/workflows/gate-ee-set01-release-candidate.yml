name: GATE EE Set 01 Formatter Release Candidate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-set01-formatter-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/qualify_gate_ee_set01_release.py --check
      - run: pytest -q tests/test_gate_ee_set01_release_qualification.py
      - run: git diff --check
