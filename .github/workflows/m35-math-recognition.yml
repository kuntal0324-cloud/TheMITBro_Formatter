name: TheMITbro M35 Universal Mathematics Recognition

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m35:
    name: M35 - Math OCR and Scientific Notation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile M35 modules
        env:
          PYTHONPATH: .
        run: |
          set -e
          python -m py_compile src/math_ocr_normalizer.py
          python -m py_compile src/math_segmenter.py
          python -m py_compile src/scientific_notation_normalizer.py
          python -m py_compile src/universal_math_recognizer.py
          python -m py_compile src/question_ingest.py
          echo "M35 source integrity: PASSED"

      - name: Run M35 focused tests
        env:
          PYTHONPATH: .
        run: |
          set -e
          python -m pytest -q \
            tests/test_milestone35_math_ocr.py \
            tests/test_milestone35_segmenter.py \
            tests/test_milestone35_scientific_notation.py \
            tests/test_milestone35_universal_recognizer.py \
            tests/test_milestone35_ingestion.py \
            tests/test_milestone35_physics_classifier.py

      - name: Run complete regression suite
        env:
          PYTHONPATH: .
        run: |
          set -e
          python -m pytest -q

      - name: M35 acceptance
        run: |
          echo "=============================================="
          echo "TheMITbro Milestone 35"
          echo "Universal Mathematical Recognition"
          echo "=============================================="
          echo "Unicode mathematics normalization: PASSED"
          echo "OCR math normalization: PASSED"
          echo "Math segmentation: PASSED"
          echo "Matrices and determinants: PASSED"
          echo "Calculus / differential equations: PASSED"
          echo "Vector calculus / transforms: PASSED"
          echo "Probability / statistics: PASSED"
          echo "Complex / engineering notation: PASSED"
          echo "Electrical Engineering notation: PASSED"
          echo "JEE Physics classification expansion: PASSED"
          echo "GATE EE classification expansion: PASSED"
          echo "Question Bank integration: PASSED"
          echo "Complete regression: PASSED"
          echo "=============================================="
          echo "MILESTONE 35 CI VALIDATION PASSED"
          echo "=============================================="
