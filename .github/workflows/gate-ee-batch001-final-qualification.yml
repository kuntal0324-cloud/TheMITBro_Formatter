name: GATE EE Batch 001 Final Qualification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Final Batch 001 qualification tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_gate_ee_batch001_qualification.py tests/test_gate_ee_batch001_final_resolution.py
      - name: Generate final qualification
        env:
          PYTHONPATH: .
        run: |
          python -m src.run_gate_ee_batch_qualification
          python -c 'import json; p=json.load(open("output/gate_ee_batch_001/FORMATTER_V2_QUALIFICATION.json")); assert p["status"] == "PASS"; assert p["formatter_pass_count"] == 20; assert p["formatter_review_count"] == 0; assert p["invalid_count"] == 0; assert p["release_gate"] == "BLOCKED"; assert p["paper_eligible_count"] == 0; assert p["independent_human_review_required"] is True'
          echo "20 PASS / 0 REVIEW / 0 invalid verified; human review and release gates remain blocked."
      - name: Confirm checked strict evidence is reproducible
        env:
          PYTHONPATH: .
        run: |
          python scripts/export_gate_ee_batch001_evidence.py
          git diff --exit-code -- GATE_EE_BATCH001_QUALIFICATION_SUMMARY.json output/gate_ee_batch_001/FORMATTER_V2_STRICT_REQUALIFICATION.json output/gate_ee_batch_001/QUESTION_BANK_FINAL_EVIDENCE_EXPORT.json
      - name: Preserve frozen Formatter regression
        env:
          PYTHONPATH: .
        run: python -m pytest -q
