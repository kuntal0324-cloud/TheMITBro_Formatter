name: TheMITbro M27 Quality

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  m27-quality:
    name: Production Quality + End-to-End Validation
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v6

      # ============================================================
      # 2. PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      # ============================================================
      # 3. DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

          python -m pip install pytest pytest-cov

      # ============================================================
      # 4. REQUIRED FILES
      # ============================================================

      - name: Verify M27 required files
        run: |
          set -e

          echo "=== M27 required files ==="

          test -f docs/milestones/M27/ACCEPTANCE.md
          test -f docs/milestones/M27/RELEASE_NOTES.md
          test -f tests/test_milestone27_quality.py
          test -f scripts/m27_quality_audit.py
          test -f input/milestone27_quality_corpus.json
          test -f .github/workflows/m27-quality.yml

          echo "M27 required files: PASSED"

      # ============================================================
      # 5. SOURCE VALIDATION
      # ============================================================

      - name: Validate Python source
        run: |
          set -e

          python -m compileall -q src scripts tests

          echo "Python source compilation: PASSED"

      # ============================================================
      # 6. M27 QUALITY TESTS
      # ============================================================

      - name: Run M27 quality tests
        env:
          PYTHONPATH: .
        run: |
          set -e

          python -m pytest -q tests/test_milestone27_quality.py

      # ============================================================
      # 7. INDEPENDENT M27 AUDIT
      # ============================================================

      - name: Run M27 quality audit
        env:
          PYTHONPATH: .
        run: |
          set -e

          python scripts/m27_quality_audit.py

      # ============================================================
      # 8. RELEASE CLEANLINESS
      # ============================================================

      - name: Verify release cleanliness
        run: |
          set -e

          if git ls-files | grep -E '(^|/)(__pycache__|.*\.py[cod]$)' ; then
            echo "ERROR: Python cache/bytecode files are tracked in Git."
            exit 1
          fi

          if git ls-files | grep -E '(^|/)(\.coverage$|coverage/)' ; then
            echo "ERROR: Coverage output is tracked in Git."
            exit 1
          fi

          if git ls-files | grep -E '(^|/)\.pytest_cache(/|$)' ; then
            echo "ERROR: .pytest_cache is tracked in Git."
            exit 1
          fi

          echo "Release cleanliness: PASSED"

      # ============================================================
      # 9. FINAL ACCEPTANCE
      # ============================================================

      - name: M27 acceptance
        run: |
          echo "=============================================="
          echo "TheMITbro Milestone 27"
          echo "Production Quality + End-to-End Validation"
          echo "=============================================="
          echo "Required files: PASSED"
          echo "Source compilation: PASSED"
          echo "M27 quality tests: PASSED"
          echo "M27 quality audit: PASSED"
          echo "Release cleanliness: PASSED"
          echo "=============================================="
          echo "MILESTONE 27 QUALITY VALIDATION PASSED"
          echo "=============================================="
